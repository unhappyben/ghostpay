<!-- GHOSTPAY dashboard + reports fragment (storage schema v4).
     Scoped styles for the #tab-dashboard / #tab-reports mounts on index.html, layered
     on the gp-ui.css primitives (gp-stat, gp-card, gp-table, gp-pill, gp-empty,
     gp-eyebrow, gp-skeleton). No unscoped rules, no hardcoded colours: every colour
     is a --gp-* token, so the profile accent hook keeps working.
     Pasting this block into the page is optional: gp-reports.mjs renders straight into
     the two mounts and fetches this file to self-inject the style block (id="gpr-styles")
     when it is not already present. -->
<style id="gpr-styles">
  /* stat cards: the .gp-stat primitive in a 4-up grid */
  #tab-dashboard .gpr-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  #tab-dashboard .gpr-cards .gp-stat { min-width:0; }
  #tab-dashboard .gpr-cards .gp-stat-num { white-space:nowrap; }
  #tab-dashboard .gpr-usd { font-size:var(--gp-fs-micro); color:var(--gp-faint); margin-top:2px; }
  /* section dividers: sentence-case source, eyebrow styling */
  #tab-dashboard .gpr-section, #tab-reports .gpr-section { font-size:var(--gp-fs-micro);
    letter-spacing:.16em; text-transform:uppercase; color:var(--gp-muted); margin:26px 0 10px; }
  #tab-dashboard .gpr-split .gpr-section { margin-top:0; }
  /* aging: flat bars on the .gp-bar proportions, severity ramp from bone to red */
  #tab-dashboard .gpr-barrow { display:flex; align-items:center; gap:10px; margin-top:10px;
    font-size:var(--gp-fs-micro); }
  #tab-dashboard .gpr-barrow:first-child { margin-top:0; }
  #tab-dashboard .gpr-barlbl { width:76px; flex:none; color:var(--gp-muted);
    letter-spacing:.08em; white-space:nowrap; }
  #tab-dashboard .gpr-bar { flex:1; height:10px; background:var(--gp-bg-inset);
    border:1px solid var(--gp-line); border-radius:3px; overflow:hidden; }
  #tab-dashboard .gpr-barfill { display:block; height:100%; background:var(--gp-muted); }
  #tab-dashboard .gpr-barfill.sev-1 { background:color-mix(in srgb, var(--gp-accent) 45%, var(--gp-bg-raise)); }
  #tab-dashboard .gpr-barfill.sev-2 { background:color-mix(in srgb, var(--gp-accent) 80%, var(--gp-bg-raise)); }
  #tab-dashboard .gpr-barfill.sev-3 { background:var(--gp-danger); }
  #tab-dashboard .gpr-barval { flex:none; min-width:170px; text-align:right; }
  #tab-dashboard .gpr-barcnt { color:var(--gp-muted); }
  #tab-dashboard .gpr-aging { margin-top:0; }
  /* activity + top clients split */
  #tab-dashboard .gpr-split { display:grid; grid-template-columns:3fr 2fr; gap:18px; margin-top:26px; }
  #tab-dashboard .gpr-split > div { display:flex; flex-direction:column; }
  #tab-dashboard .gpr-split .gp-empty { flex:1; display:flex; flex-direction:column; justify-content:center; }
  #tab-dashboard .gpr-when { white-space:nowrap; color:var(--gp-muted); }
  #tab-dashboard .gpr-dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:8px; vertical-align:1px; background:var(--gp-faint); }
  #tab-dashboard .gpr-dot.ok { background:var(--gp-ok); }
  #tab-dashboard .gpr-dot.accent { background:var(--gp-accent); }
  #tab-dashboard .gpr-dot.info { background:var(--gp-info); }
  #tab-dashboard .gpr-rank { width:1%; color:var(--gp-faint); }
  /* table cell utilities (both panes) */
  #tab-dashboard .gpr-r, #tab-reports .gpr-r { text-align:right; }
  #tab-dashboard .gpr-nowrap, #tab-reports .gpr-nowrap { white-space:nowrap; }
  /* reports: one block per report, range row on token inputs */
  #tab-reports .gpr-report { margin-top:28px; }
  #tab-reports .gpr-report:first-child { margin-top:4px; }
  #tab-reports .gpr-report .gpr-section { margin:0 0 10px; }
  #tab-reports .gpr-range { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  #tab-reports .gpr-range .gp-eyebrow { flex:none; }
  #tab-reports .gpr-range .gp-input { width:auto; flex:1 1 130px; padding:9px 12px; }
  #tab-reports .gpr-range .gp-btn { flex:none; }
  #tab-reports .gpr-totalrow td { border-top:1px solid var(--gp-line-strong); border-bottom:0; }
  #tab-dashboard .gpr-footnote, #tab-reports .gpr-footnote { font-size:var(--gp-fs-micro);
    color:var(--gp-muted); margin-top:8px; }
  @media (max-width:700px) {
    #tab-dashboard .gpr-cards { grid-template-columns:1fr 1fr; }
    #tab-dashboard .gpr-cards .gp-stat-num { font-size:20px; }
    #tab-dashboard .gpr-split { grid-template-columns:1fr; }
    #tab-dashboard .gpr-split .gpr-section { margin-top:8px; }
    #tab-dashboard .gpr-barrow { flex-wrap:wrap; row-gap:4px; }
    #tab-dashboard .gpr-barval { flex:1 1 100%; min-width:0; text-align:right; }
    #tab-reports .gpr-range { flex-direction:column; align-items:stretch; }
    /* column direction turns flex-basis into height: pin the controls instead */
    #tab-reports .gpr-range .gp-input, #tab-reports .gpr-range .gp-btn { flex:none; width:100%; min-height:44px; }
    #tab-reports .gpr-range .gp-input { font-size:16px; }
  }
</style>
